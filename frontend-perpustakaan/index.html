
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perpustakaan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

    <!-- Header -->
    <header class="bg-blue-600 text-white shadow">
        <div class="max-w-5xl mx-auto px-4 py-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
            <h1 class="text-2xl font-bold">📚 Perpustakaan</h1>
            <nav class="flex gap-2" id="main-nav">
                <a href="#/" data-route="/" class="nav-link px-3 py-2 rounded hover:bg-blue-700">Dashboard</a>
                <a href="#/books" data-route="/books" class="nav-link px-3 py-2 rounded hover:bg-blue-700">Buku</a>
                <a href="#/categories" data-route="/categories" class="nav-link px-3 py-2 rounded hover:bg-blue-700">Kategori</a>
            </nav>
        </div>
    </header>

    <!-- Area konten (diisi oleh router app.js) -->
    <main id="app" class="max-w-5xl mx-auto px-4 py-6">
        <p class="text-gray-500">Memuat aplikasi...</p>
    </main>

    <!-- Wadah notifikasi toast (kanan atas) -->
    <div id="toast-container" class="fixed top-4 right-4 z-50 space-y-2"></div>

    <!-- Urutan script penting: config -> api -> utils -> halaman -> app -->
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>

    <script src="js/pages/dashboard.js"></script>
    <script src="js/pages/books.js"></script>
    <script src="js/pages/categories.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
